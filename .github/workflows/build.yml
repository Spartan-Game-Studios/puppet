name: build

# Builds and tests on every push and PR. Produces unsigned app bundles as
# workflow artifacts. Never creates releases or tags.
on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Linux deps (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # VRM compatibility sweep on the committed CC0 fixtures (test-assets/cc0/),
  # headless Chrome with software GL. Fails on any FAIL check; the HTML report
  # is uploaded as an artifact. See README "Compatibility sweep".
  compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sweep the committed CC0 avatars
        env:
          PUPPET_NO_APP: '1'
          PUPPET_STRICT: '1'
          PUPPET_CI: '1'
          PUPPET_CHROME_ARGS: --use-angle=swiftshader --disable-gpu
        run: node scripts/compat-sweep.mjs harness/out/compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: harness/out/compat
          if-no-files-found: ignore

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            args: ''
            rust_targets: ''
          - platform: windows-latest
            name: windows-x64
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Optional macOS signing (see docs/virtual-camera.md). Without these
      # secrets the build is unsigned and the camera extension is ad-hoc signed.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.PUPPET_APP_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - name: macOS signing setup (only when the secrets exist)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          PUPPET_APP_PROFILE_B64: ${{ secrets.PUPPET_APP_PROFILE }}
          PUPPET_CAMEXT_PROFILE_B64: ${{ secrets.PUPPET_CAMEXT_PROFILE }}
        run: |
          # The camera extension is signed in beforeBundleCommand, before Tauri
          # imports the certificate itself, so put it in a keychain now.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PUPPET_APP_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          if [ -n "$PUPPET_CAMEXT_PROFILE_B64" ]; then
            echo "$PUPPET_CAMEXT_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/camext.provisionprofile"
            echo "PUPPET_CAMEXT_PROFILE=$RUNNER_TEMP/camext.provisionprofile" >> "$GITHUB_ENV"
          fi
          PUPPET_APP_PROFILE="$RUNNER_TEMP/app.provisionprofile" bash src-tauri/macos/prepare-signing.sh
          echo "SIGNED_CONFIG=--config src-tauri/macos/build/tauri.signed.conf.json" >> "$GITHUB_ENV"
          # Only now do the signing variables exist for the build step: Tauri
          # tries to sign whenever APPLE_SIGNING_IDENTITY is set, even empty.
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            fi
          } >> "$GITHUB_ENV"
      - name: Build (no release)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ env.SIGNED_CONFIG }}
      - name: Check the virtual camera is in the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            APP=$(ls -d src-tauri/target/*/release/bundle/macos/Puppet.app)
            EXT="$APP/Contents/Library/SystemExtensions/com.spartangamestudios.puppet.camera.systemextension"
            test -x "$EXT/Contents/MacOS/com.spartangamestudios.puppet.camera"
            lipo -info "$EXT/Contents/MacOS/com.spartangamestudios.puppet.camera"
            plutil -p "$EXT/Contents/Info.plist" | grep -E 'CMIOExtensionMachServiceName|CFBundlePackageType'
            codesign --verify --strict --verbose=1 "$EXT"
          elif [ "$RUNNER_OS" = Windows ]; then
            test -f src-tauri/vendor/softcam/softcam.dll
            test -f src-tauri/target/release/softcam.dll
            ls -l src-tauri/target/release/softcam.dll
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: puppet-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
