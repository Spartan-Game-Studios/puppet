name: build

# Builds and tests on every push and PR. Produces unsigned app bundles as
# workflow artifacts. Never creates releases or tags.
on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Linux deps (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # VRM compatibility sweep on the committed CC0 fixtures (test-assets/cc0/),
  # headless Chrome with software GL. Fails on any FAIL check; the HTML report
  # is uploaded as an artifact. See README "Compatibility sweep".
  compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sweep the committed CC0 avatars
        env:
          PUPPET_NO_APP: '1'
          PUPPET_STRICT: '1'
          PUPPET_CI: '1'
          PUPPET_CHROME_ARGS: --use-angle=swiftshader --disable-gpu
        run: node scripts/compat-sweep.mjs harness/out/compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: harness/out/compat
          if-no-files-found: ignore

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            args: ''
            rust_targets: ''
          - platform: windows-latest
            name: windows-x64
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Optional macOS signing (see docs/virtual-camera.md). Without these
      # secrets the build is unsigned and the camera extension is ad-hoc signed.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.PUPPET_APP_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - name: macOS signing setup (only when the secrets exist)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          PUPPET_APP_PROFILE_B64: ${{ secrets.PUPPET_APP_PROFILE }}
          PUPPET_CAMEXT_PROFILE_B64: ${{ secrets.PUPPET_CAMEXT_PROFILE }}
          PUPPET_CAMHOST_PROFILE_B64: ${{ secrets.PUPPET_CAMHOST_PROFILE }}
        run: |
          # The camera extension is signed in beforeBundleCommand, before Tauri
          # imports the certificate itself, so put it in a keychain now.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$PUPPET_APP_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          if [ -n "$PUPPET_CAMEXT_PROFILE_B64" ]; then
            echo "$PUPPET_CAMEXT_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/camext.provisionprofile"
            echo "PUPPET_CAMEXT_PROFILE=$RUNNER_TEMP/camext.provisionprofile" >> "$GITHUB_ENV"
          fi
          if [ -n "$PUPPET_CAMHOST_PROFILE_B64" ]; then
            echo "$PUPPET_CAMHOST_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/camhost.provisionprofile"
            echo "PUPPET_CAMHOST_PROFILE=$RUNNER_TEMP/camhost.provisionprofile" >> "$GITHUB_ENV"
          fi
          PUPPET_APP_PROFILE="$RUNNER_TEMP/app.provisionprofile" bash src-tauri/macos/prepare-signing.sh
          echo "SIGNED_CONFIG=--config src-tauri/macos/build/tauri.signed.conf.json" >> "$GITHUB_ENV"
          # Only now do the signing variables exist for the build step: Tauri
          # tries to sign whenever APPLE_SIGNING_IDENTITY is set, even empty.
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            fi
          } >> "$GITHUB_ENV"
      - name: Build (no release)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ env.SIGNED_CONFIG }}
      - name: Check the virtual camera is in the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            APP=$(ls -d src-tauri/target/*/release/bundle/macos/VPuppet.app)
            HELPER="$APP/Contents/Helpers/VPuppet Camera.app"
            test -x "$HELPER/Contents/MacOS/VPuppet Camera"
            lipo -info "$HELPER/Contents/MacOS/VPuppet Camera"
            codesign --verify --strict --verbose=1 "$HELPER"
            EXT="$HELPER/Contents/Library/SystemExtensions/com.spartangamestudios.vpuppet.camera.systemextension"
            test -x "$EXT/Contents/MacOS/com.spartangamestudios.vpuppet.camera"
            lipo -info "$EXT/Contents/MacOS/com.spartangamestudios.vpuppet.camera"
            plutil -p "$EXT/Contents/Info.plist" | grep -E 'CMIOExtensionMachServiceName|CFBundlePackageType'
            codesign --verify --strict --verbose=1 "$EXT"
          elif [ "$RUNNER_OS" = Windows ]; then
            test -f src-tauri/vendor/softcam/softcam.dll
            test -f src-tauri/target/release/softcam.dll
            ls -l src-tauri/target/release/softcam.dll
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vpuppet-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The free Steam demo (cargo features demo + steam) for Windows and Linux,
  # on manual runs only. macOS is built, signed and notarized locally with
  # `DEMO=1 bash steam/steampipe/build-macos.sh`. The artifacts are the files
  # the SteamPipe demo depots ship (steam/steampipe/depot_build_demo_*.vdf).
  demo:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            bundles: appimage
          - platform: windows-latest
            name: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    env:
      # The demo's BUY button opens the full app's store page.
      VPUPPET_STEAM_APP_ID: '5540350'
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: demo-${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - name: Stage the Steamworks runtime library
        run: node scripts/stage-steam-redist.mjs
      - name: Let the AppImage bundler find libsteam_api.so (Linux)
        if: runner.os == 'Linux'
        # linuxdeploy copies every library the binary links into the AppImage
        # (usr/lib, with an rpath to it), but only libraries it can resolve.
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/src-tauri/vendor/steam" >> "$GITHUB_ENV"
      - name: Build the demo (no release)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --features demo,steam --config src-tauri/tauri.demo.conf.json --bundles ${{ matrix.bundles }}
      - name: Collect the depot files
        shell: bash
        run: |
          set -euo pipefail
          OUT=demo-depot
          mkdir -p "$OUT"
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/vpuppet.exe "$OUT/"
            cp src-tauri/target/release/softcam.dll src-tauri/target/release/LICENSE-softcam.txt "$OUT/"
            cp src-tauri/vendor/steam/steam_api64.dll "$OUT/"
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage "$OUT/VPuppet.AppImage"
            chmod +x "$OUT/VPuppet.AppImage"
            cp src-tauri/vendor/steam/libsteam_api.so "$OUT/"
            # The AppImage must carry libsteam_api.so and the binary must find it.
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/$OUT/VPuppet.AppImage" --appimage-extract >/dev/null
            find squashfs-root -name 'libsteam_api.so' | grep -q . || { echo "AppImage lacks libsteam_api.so" >&2; exit 1; }
            BIN=$(find squashfs-root/usr/bin -maxdepth 1 -type f -name 'vpuppet*' | head -1)
            env -u LD_LIBRARY_PATH ldd "$BIN" | tee ldd.txt | grep steam_api
            if grep -q 'steam_api.*not found' ldd.txt; then echo "vpuppet cannot find libsteam_api.so inside the AppImage" >&2; exit 1; fi
          fi
          ls -l "$GITHUB_WORKSPACE/$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vpuppet-demo-${{ matrix.name }}
          path: demo-depot/
          if-no-files-found: error
