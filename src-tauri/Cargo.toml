[package]
name = "puppet"
version = "0.1.0"
description = "Free, open-source webcam VTuber app"
authors = ["Spartan Game Studios"]
license = "MIT"
repository = "https://github.com/Spartan-Game-Studios/puppet"
edition = "2021"
rust-version = "1.77"

[lib]
name = "puppet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
